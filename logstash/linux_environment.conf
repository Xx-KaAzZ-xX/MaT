input {
  file {
    path => ["${CASE_PATH}/*.csv", "${CASE_PATH}/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["${CASE_TAG:unknown}"]
  }
}

filter {
  # Ajout de csv_path
  mutate {
    add_field => { "csv_path" => "%{[log][file][path]}" }
  }
  if [csv_path] =~ "linux_connections.csv" {
    csv {
      columns => ["computer_name", "connection_date", "user", "src_ip", "source_file", "asn", "country", "ip_type", "tor_exit"]
      separator => ","
      skip_header => "true"
    }
  }
  else if [csv_path] =~ "linux_firewall_rules.csv" {
    csv {
        columns => ["computer_name", "firewall", "source_file", "table", "chain", "protocol", "policy", "src_ip", "src_port", "dest_ip", "dest_port", "raw_rule"]
        separator => ","
        skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_installed_apps.csv" {
    csv {
        columns => ["computer_name", "package_name", "install_date", "version"]
        separator => ","
        skip_header => "true"
    }
  }

else if [csv_path] =~ "linux_crontab.csv" {
    csv {
        columns => ["computer_name", "user", "scheduled", "task", "source_file"]
        separator => ","
        skip_header => "true"
    }
  }
  else if [csv_path] =~ "linux_network_info.csv" {
    csv {
        columns => ["computer_name", "interface", "ip_address", "netmask", "gateway"]
        separator => ","
        skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_services.csv" {
    csv {
        columns => ["computer_name", "service_name", "status", "status_at_boot"]
        separator => ","
        skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_system_info.csv" {
    csv {
        columns => ["computer_name", "distro", "distro_version", "installation_date", "ntp_server", "dns_server", "last_update", "last_event"]
        separator => ","
        skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_users_and_groups.csv" {
    csv {
        columns => ["computer_name", "username", "uid", "gid", "groups"]
        separator => ","
        skip_header => "true"
    }
  }
  else if [csv_path] =~ "linux_disk_usage.csv" {
    csv {
        columns => ["computer_name", "directory", "percent_used"]
        separator => ","
        skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_browsing_history.csv" {
    csv {
      columns => ["computer_name", "source", "user", "url_title", "link", "search_date"]
      separator => ","
      skip_header => "true"
    }
  }
  else if [csv_path] =~ "linux_websites.csv" {
    csv {
      columns => ["computer_name", "website_name", "website_root", "listening_port", "webserver", "source_file"]
      separator => ","
      skip_header => "true"
    }
  }

  else if [csv_path] =~ "linux_command_history.csv" {
    csv {
      columns => ["computer_name", "user", "shell", "command_date", "command"]
      separator => ","
      skip_header => "true"
    }
  }
  else if [csv_path] =~ "linux_files_of_interest" {
    csv {
      columns => ["computer_name", "type", "match", "source_file"]
      separator => ","
      skip_header => "true"
    }
  }
   else if [csv_path] =~ "linux_docker" {
    csv {
      columns => ["computer_name", "container_name", "container_state", "container_ip", "exposed_ports", "volumes", "log_file", "overlay_directory", "image_url", "build_time"]
      separator => ","
      skip_header => "true"
    }
  }
   else if [csv_path] =~ "linux_admin_panel" {
    csv {
      columns => ["computer_name","admin_panel_app", "source_file", "log_file"]
      separator => ","
      skip_header => "true"
    }
  }
   else if [csv_path] =~ "ia_apps" {
    csv {
      columns => ["computer_name", "ia_app", "source_file"]
      separator => ","
      skip_header => "true"
    }
  }
   else if [csv_path] =~ "ia_prompts" {
    csv {
      columns => ["computer_name", "ia_app", "prompt", "response", "prompt_time", "source_file"]
      separator => ","
      skip_header => "true"
    }
    ruby {
      code => '
        ["prompt", "response"].each do |f|
          v = event.get(f)
          event.set(f, v.gsub("\\n", "\n")) if v.is_a?(String)
        end
      '
    }
  }

  else if [csv_path] =~ "crypto" {
    csv {
      columns => ["computer_name", "type", "match", "source_file", "verified"]
      separator => ","
      skip_header => "true"
    }
 }

  else if [csv_path] =~ "instant_messaging" {
    csv {
      columns => ["computer_name", "im_app", "im_account", "im_password", "source_file"]
      separator => ","
      skip_header => "true"
    }
 }


  else if [csv_path] =~ "linux_inode_table" {
    csv {
      columns => ["computer_name", "inode", "deleted", "source_path", "ctime", "mtime", "atime"]
      separator => ","
      skip_header => "true"
    }
 }

  else if [csv_path] =~ "journalctl.log" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:computer_name} %{WORD:process_name}\[%{POSINT:process_id}\]: %{GREEDYDATA:log_message}"
      }
    } 
    date {
      match => [ "timestamp", "ISO8601"]
      target => "@timestamp"
    }
 }



 # Drop header lines
  if [computer_name] == "computer_name" or [Record Number] == "Record Number" {
      drop {}
    }
 }
    


output {
  stdout {
    codec => rubydebug
  }
  elasticsearch {
    action => "index"
    hosts => ["127.0.0.1:9200"]
    index => "environment_index"
  }
}
